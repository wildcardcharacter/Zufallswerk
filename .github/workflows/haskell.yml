name: Haskell CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgirepository-1.0-dev gir1.2-glib-2.0-dev pkg-config
      - name: Make GLib GIR metadata visible to haskell-gi
        run: sudo rm -f /usr/share/gir-1.0/GLib-2.0.gir && sudo install -D /usr/lib/"$(dpkg-architecture -qDEB_HOST_MULTIARCH)"/gir-1.0/GLib-2.0.gir /usr/share/gir-1.0/GLib-2.0.gir
      - run: cabal update
      - run: cabal build all
      - run: cabal test all

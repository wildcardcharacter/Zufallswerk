name: Haskell CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cabal update
      - run: cabal build all
      - run: cabal test all

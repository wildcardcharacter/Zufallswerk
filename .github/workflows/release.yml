name: Build and publish Debian release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cabal update
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Build Debian package
        run: ./build-deb.sh
      - name: Create release or upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="zufallswerk_$(cat VERSION)_$(dpkg --print-architecture).deb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$package" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$package" --generate-notes
          fi

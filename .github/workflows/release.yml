name: Build and publish Debian release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgirepository-1.0-dev gir1.2-glib-2.0-dev pkg-config
      - name: Make GLib GIR metadata visible to haskell-gi
        run: sudo rm -f /usr/share/gir-1.0/GLib-2.0.gir && sudo install -D /usr/lib/"$(dpkg-architecture -qDEB_HOST_MULTIARCH)"/gir-1.0/GLib-2.0.gir /usr/share/gir-1.0/GLib-2.0.gir
      - run: cabal update
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Build Debian package
        run: ./build-deb.sh
      - name: Create release or upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="zufallswerk_$(cat VERSION)_$(dpkg --print-architecture).deb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$package" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$package" --title "Zufallswerk $GITHUB_REF_NAME" --generate-notes
          fi
